[package]
name = "abmedia-v2"
version = "0.1.0"
edition = "2021"
description = "AB Media landing page v2: storytelling and go-to-market for awareness and trust (Rust / Axum)"

[dependencies]
axum = "0.7"
# tokio is held at the 1.43 LTS line (and Cargo.lock pins mio 1.0 / socket2 0.5 / hyper 1.6):
# newer releases use windows-sys 0.61 (raw-dylib), which needs an assembler that the
# plain windows-gnu Rust toolchain does not ship. Don't run a blanket `cargo update`.
tokio = { version = "~1.43", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "signal"] }
tower-http = { version = "0.5", features = ["fs", "compression-gzip", "set-header"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }

[profile.release]
opt-level = 3
lto = "thin"
