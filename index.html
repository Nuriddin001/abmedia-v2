<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AB Media — Storytelling & Go-to-market</title>
<meta name="description" content="AB Media: storytelling and go-to-market campaigns that make customers know you and trust you. One team from the audit to the market.">
<meta property="og:title" content="AB Media — storytelling and go-to-market for awareness and trust">
<meta property="og:image" content="media/uztelecom.jpg">
<meta name="theme-color" content="#08090A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- dark from the very first frame, even before any file arrives -->
<style>html,body{background:#08090A;color:#EDF1F1}</style>
<!-- fonts never hold the page back: it paints at once and the fonts swap in when they arrive -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Unbounded:wght@600;700&family=Noto+Kufi+Arabic:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Unbounded:wght@600;700&family=Noto+Kufi+Arabic:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="static/style.css">
<script>document.documentElement.classList.add("js");</script>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-arrow" viewBox="0 0 20 20"><path d="M3 10h13M11 5l5 5-5 5"/></symbol>
  <symbol id="i-x" viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8"/></symbol>
  <symbol id="i-play" viewBox="0 0 20 20"><path d="M7 4.5v11l9-5.5z"/></symbol>
  <symbol id="i-reel" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="7.3" r="1.7"/><circle cx="16.5" cy="10.6" r="1.7"/><circle cx="14.8" cy="15.9" r="1.7"/><circle cx="9.2" cy="15.9" r="1.7"/><circle cx="7.5" cy="10.6" r="1.7"/></symbol>
  <symbol id="i-clap" viewBox="0 0 24 24"><path d="M3.5 10.5h17v9.5h-17zM3.5 10.5l-.6-3.8 16.4-2.6.6 3.8zM8.2 6l2 4.5M13.7 5.1l2 4.6"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><circle cx="9" cy="12" r="5.2"/><circle cx="15" cy="12" r="5.2"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r=".9"/></symbol>
</svg>

<!-- film leader: 3, 2, 1, then the letterbox opens -->
<div class="leader" id="leader" aria-hidden="true">
  <svg class="ld-svg" viewBox="0 0 200 200"><circle class="ld-ring" cx="100" cy="100" r="88"/><circle class="ld-ring2" cx="100" cy="100" r="70"/><path class="ld-sweep" id="ld-sweep" d=""/><path class="ld-cross" d="M100 0V200M0 100H200"/></svg>
  <b class="ld-n" id="ld-n">3</b>
  <i class="lb lb-t"></i><i class="lb lb-b"></i>
</div>

<canvas class="grain" id="grain" aria-hidden="true"></canvas>
<div class="cursor" id="cursor" aria-hidden="true"><i class="c-dot"></i><span class="c-ring"><svg class="ic"><use href="#i-play"/></svg><span class="c-label" data-i="cur_play"></span></span></div>

<header class="hd" id="hd">
  <div class="wrap hd-in">
    <a class="logo" href="#top" aria-label="AB Media"><i aria-hidden="true"></i>AB MEDIA</a>
    <nav class="nav" id="nav" aria-label="Sections"><a href="#journey"></a><a href="#cases"></a><a href="#how"></a><a href="#faq"></a></nav>
    <div class="langs" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="ar">AR</button></div>
    <a class="cta mag" href="#request"><span data-i="hero_cta"></span><svg class="ic"><use href="#i-arrow"/></svg></a>
  </div>
  <i class="prog" id="prog" aria-hidden="true"></i>
</header>

<nav class="rail" id="rail" aria-hidden="true"></nav>

<div class="offer away" id="offer"><span id="bar-t"></span><b class="timer" id="timer">05:00</b></div>

<main>
  <!-- the film plays inside the wordmark; scrolling zooms through a letter into the film -->
  <section class="hero" id="top" data-scene="top">
    <div class="hero-pin" id="hero-pin">
      <div class="hero-film" id="hero-film"><video id="hv0" muted playsinline loop preload="auto"></video><video id="hv1" muted playsinline loop preload="none"></video><i class="hf-shade"></i></div>
      <svg class="hero-mask" id="hero-mask" aria-hidden="true"><defs><mask id="word-mask" maskUnits="userSpaceOnUse"><rect id="wm-bg" fill="#fff"/><g id="wm-g"><text id="wm-t" fill="#000" text-anchor="middle" dominant-baseline="central">AB MEDIA</text></g></mask></defs><rect id="wm-cover" mask="url(#word-mask)"/></svg>
      <canvas class="beam" id="beam" aria-hidden="true"></canvas>
      <h1 class="sr" id="h1"></h1>
      <div class="hero-q" id="hero-q"><p data-i="hero_q"></p><span class="cue"><i></i><span data-i="cue"></span></span></div>
      <p class="hero-line" id="hero-line" aria-hidden="true"></p>
      <div class="hero-hud" id="hero-hud" aria-hidden="true"><span class="rec"><i></i>REC</span><button class="now" type="button" id="now"><small data-i="reel_now"></small><b id="now-c"></b><span id="now-m"></span></button></div>
    </div>
  </section>

  <!-- 100 people: 88 forget the ad, the story brings them back -->
  <section class="manifest" id="manifest" data-scene="manifest">
    <div class="mf-pin" id="mf-pin">
      <div class="wrap mf-in">
        <p class="mf" id="mf"></p>
        <div class="crowd" id="crowd" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <section class="ticker" aria-label="AB Media"><div class="tk-row" id="tk"></div></section>

  <!-- customer journey: one ribbon of people, narrowing at every stage -->
  <section class="journey" id="journey" data-scene="journey">
    <div class="story" id="story">
      <div class="wrap story-in">
        <div class="story-text">
          <h2 data-i="j_h"></h2>
          <ol class="beats" id="beats"></ol>
        </div>
        <div class="river" id="river"><canvas id="river-cv" aria-hidden="true"></canvas><div class="gates" id="gates"></div></div>
      </div>
    </div>
    <div class="wrap calc" id="calc">
      <div class="calc-top">
        <h3 data-i="calc_h"></h3>
        <div class="seg" role="group" id="jmode"><button type="button" data-m="0"></button><button type="button" data-m="1"></button><i class="seg-k"></i></div>
      </div>
      <div class="reach"><label for="reach"><span data-i="c_reach"></span><output id="reach-o" for="reach"></output></label><div class="range"><input type="range" id="reach"><i class="range-f" id="range-f"></i></div></div>
      <div class="jrow" id="jstages" aria-live="polite"></div>
      <div class="jsum"><p id="jsum"></p><button class="btn mag" type="button" id="jsend"><span data-i="c_cta"></span><svg class="ic"><use href="#i-arrow"/></svg></button></div>
      <p class="note" data-i="j_note"></p>
    </div>
  </section>

  <!-- ads flash and fade; a story keeps glowing -->
  <section class="duel" id="diff" data-scene="diff">
    <div class="duel-pin" id="duel-pin">
      <div class="wrap duel-in">
        <h2 class="duel-h" data-i="d_h"></h2>
        <div class="reads"><div class="read ad"><b id="r-ad">0%</b><span data-i="d_ad"></span></div><div class="read film"><b id="r-film">0%</b><span data-i="d_film"></span></div></div>
        <div class="scope" id="scope">
          <svg class="scope-svg" id="scope-svg" viewBox="0 0 1000 360" preserveAspectRatio="none" aria-hidden="true"></svg>
          <span class="end-t" id="end-t" data-i="d_end"></span>
          <i class="dot ad" id="dot-ad"></i><i class="dot film" id="dot-film"></i>
        </div>
      </div>
    </div>
  </section>

  <!-- work -->
  <section class="cases" id="cases" data-scene="cases">
    <div class="marq" id="marq" aria-hidden="true"><div class="marq-row" id="marq-row"></div></div>
    <p class="sr" id="marq-sr"></p>
    <div class="wrap">
      <h2 class="big-h rv" data-i="cs_h"></h2>
      <div class="feat" id="feat"></div>
      <div class="grid" id="grid"></div>
      <div class="more-row"><button class="more-btn mag" id="more-btn" type="button" aria-expanded="false" aria-controls="grid"><span id="more-lbl"></span><b id="more-n"></b><i aria-hidden="true"></i></button><p class="more" id="more"></p></div>
    </div>
  </section>

  <!-- what we fix: the problem is struck out, the fix decodes in its place -->
  <section class="fixes" id="fixes" data-scene="fixes">
    <div class="wrap">
      <h2 class="big-h rv" data-i="f_h"></h2>
      <ol class="fx-list" id="fixlist"></ol>
    </div>
  </section>

  <!-- Abror -->
  <section class="why" id="why" data-scene="why">
    <div class="wrap why-in">
      <figure class="why-ph" id="why-ph"><div class="slats" id="slats"><img src="media/abror-wallstreet.jpg" alt="" id="why-img" width="720" height="1280" loading="lazy"></div><figcaption><span data-i="role"></span></figcaption></figure>
      <div class="why-r">
        <p class="why-name" data-i="name"></p>
        <h2 class="rv" data-i="why_h"></h2>
        <ul class="reasons" id="reasons"></ul>
      </div>
    </div>
  </section>

  <!-- process -->
  <section class="how" id="how" data-scene="how">
    <div class="wrap">
      <div class="how-top"><h2 class="big-h rv" data-i="how_h"></h2><div class="how-mode"><div class="seg" role="group" id="modes"><button type="button" data-m="0"></button><button type="button" data-m="1"></button><i class="seg-k"></i></div><p class="mode-d" id="mode-d"></p></div></div>
      <div class="how-in">
        <div class="how-stick" aria-hidden="true"><div class="odo" id="how-n"></div><p class="how-t" id="how-t"></p></div>
        <ol class="steps" id="steps"><i class="steps-line" aria-hidden="true"><i id="steps-fill"></i></i></ol>
      </div>
    </div>
  </section>

  <!-- planner: the answer is drawn as a storyboard -->
  <section class="plan" id="plan" data-scene="plan">
    <div class="wrap">
      <h2 class="big-h rv" data-i="b_h"></h2>
      <div class="plan-in">
        <form class="bq" id="bq"></form>
        <div class="board" id="board" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <!-- request -->
  <section class="request" id="request" data-scene="request">
    <div class="wrap">
      <div class="rq-head"><h2 class="big-h rv" data-i="rq_h"></h2><p class="rq-p" data-i="rq_p"></p></div>
      <div class="rq-in">
        <div class="rq-next"><div class="frames" id="frames"></div><p class="slots" id="slots"></p></div>
        <div class="formcard" id="formcard">
          <form class="form" id="form" novalidate>
            <div class="brief" id="brief" hidden></div>
            <label class="fl" for="f-name"><input id="f-name" name="name" type="text" autocomplete="name" placeholder=" "><span data-i="f_name"></span><em class="err" id="e-name" hidden></em></label>
            <label class="fl" for="f-phone"><input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder=" "><span data-i="f_phone"></span><em class="err" id="e-phone" hidden></em></label>
            <label class="fl" for="f-email"><input id="f-email" name="email" type="email" autocomplete="email" placeholder=" "><span data-i="f_email"></span><em class="err" id="e-email" hidden></em></label>
            <div class="hp" aria-hidden="true"><label for="f-web">Website</label><input id="f-web" name="website" type="text" tabindex="-1" autocomplete="off"></div>
            <button class="btn btn-wide mag" type="submit"><span data-i="f_btn"></span><svg class="ic"><use href="#i-arrow"/></svg></button>
            <p class="send-err" id="send-err" role="alert" hidden></p>
            <p class="privacy" data-i="privacy"></p>
          </form>
          <div class="done" id="done" hidden aria-live="polite"><i class="cut-t"></i><i class="cut-b"></i><h3 data-i="done_h" tabindex="-1" id="done-h"></h3><p id="done-msg"></p><button type="button" class="linkbtn" id="again" data-i="again"></button></div>
        </div>
      </div>
    </div>
  </section>

  <!-- questions -->
  <section class="faq" id="faq" data-scene="faq">
    <div class="wrap faq-in">
      <h2 class="big-h rv" data-i="faq_h"></h2>
      <div class="faq-list" id="faqlist"></div>
    </div>
  </section>
</main>

<footer class="foot" id="foot">
  <div class="wrap">
    <p class="foot-t" data-i="foot"></p>
    <div class="contacts" id="contacts"></div>
  </div>
  <div class="fm" id="fm" aria-label="AB Media"></div>
  <div class="wrap legal"><span>© 2026 AB Media</span><span data-i="name"></span></div>
</footer>

<dialog class="room" id="room" aria-labelledby="room-title">
  <div class="rh"><h3 id="room-title"></h3><button class="x" type="button" id="room-x"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <div class="rb">
    <div><video id="room-v" controls playsinline preload="none"></video><div class="tabs" id="room-tabs" hidden></div></div>
    <div><p class="concept" id="room-c"></p><dl id="room-dl"></dl></div>
  </div>
</dialog>

</body>
</html>
